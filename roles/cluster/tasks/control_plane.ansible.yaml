---
- name: Configuring the container runtime including its cgroup driver
  template:
    src: '{{ role_path }}/files/kubeadm-config.j2'
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: '0644'

- name: Initialize the cluster
  shell: 'kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --v=5 >> /var/log/cluster_initialized.log'
  args:
    creates: /var/log/cluster_initialized.log

- name: Install Pod network
  become: false
  shell: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml >> {{ ansible_env.HOME }}/.kube/pod_network_setup.log
  args:
    creates: "{{ ansible_env.HOME }}/.kube/pod_network_setup.log"

- name: Waif for control plane
  wait_for:
    host: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}"
    port: 6443
    timeout: 10

- name: Get join command
  become: false
  command: kubeadm token create --print-join-command
  changed_when: true
  register: join_command_raw

- name: Set join command
  set_fact:
    join_command: "{{ join_command_raw.stdout_lines[0] }}"
