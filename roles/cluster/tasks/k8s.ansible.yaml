---
# - name: update APT packages
#   apt:
#     update_cache: yes

- name: Ensure localhost is in /etc/hosts # calico node tries to resolve localhost by default
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+localhost$'
    line: '127.0.0.1 localhost'
    state: present

- name: Load rbd module
  become: true
  modprobe:
    name: rbd
    state: present

- name: create an empty file for the Containerd module
  copy:
    content: ''
    dest: /etc/modules-load.d/containerd.conf
    force: no

- name: configure modules for Containerd
  blockinfile:
    path: /etc/modules-load.d/containerd.conf
    block: |
      overlay
      br_netfilter

- name: create an empty file for Kubernetes sysctl params
  copy:
    content: ''
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    force: no

- name: configure sysctl params for Kubernetes
  lineinfile:
    path: /etc/sysctl.d/99-kubernetes-cri.conf
    line: '{{ item }}'
  with_items:
    - 'net.bridge.bridge-nf-call-iptables  = 1'
    - 'net.ipv4.ip_forward                 = 1'
    - 'net.bridge.bridge-nf-call-ip6tables = 1'

- name: apply sysctl params without reboot
  command: sysctl --system

- name: install APT Transport HTTPS
  apt:
    name: apt-transport-https
    state: present

- name: add Docker apt-key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker-apt-keyring.asc
    mode: '0644'
    force: true

- name: add Docker's APT repository
  apt_repository:
    repo: "deb [arch={{ arch }} signed-by=/etc/apt/keyrings/docker-apt-keyring.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: add Kubernetes apt-key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ K8S_VERSION.split('.')[:2] | join('.') }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: true

- name: add Kubernetes' APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ K8S_VERSION.split('.')[:2] | join('.') }}/deb/ /"
    state: present
    update_cache: yes

- name: install Containerd
  apt:
    name: containerd.io
    state: present

- name: create Containerd directory
  file:
    path: /etc/containerd
    state: directory

- name: add Containerd configuration
  shell: /usr/bin/containerd config default > /etc/containerd/config.toml

- name: configuring the systemd cgroup driver for Containerd
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '            SystemdCgroup = false'
    line: '            SystemdCgroup = true'

- name: install Kubelet
  apt:
    name: "kubelet={{ K8S_VERSION }}-*"
    state: present
    
- name: install Kubeadm
  apt:
    name: "kubeadm={{ K8S_VERSION }}-*"
    state: present

- name: Restart containerd
  systemd:
    name: containerd
    state: restarted
    enabled: yes
    daemon-reload: yes