apiVersion: v1
kind: Service
metadata:
  name: vitess-vtadmin
  labels:
    app: vitess
    component: vtadmin
spec:
  selector:
    planetscale.com/component: vtadmin
    planetscale.com/cluster: vitess-cluster
  ports:
    - name: http
      port: 80
      targetPort: 15000
    - name: https
      port: 443
      targetPort: 15000
    - name: api
      port: 15001
      targetPort: 15001
