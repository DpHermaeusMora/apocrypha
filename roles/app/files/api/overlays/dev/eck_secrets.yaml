apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eck-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: eck-secret-store
    kind: SecretStore
  target:
    name: eck-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: es-es-elastic-user
