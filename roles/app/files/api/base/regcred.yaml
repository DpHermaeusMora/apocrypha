apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-server-regcred
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .REG_CONFIG | toString }}"
    name: api-server-regcred
    creationPolicy: Owner
  data:
    - secretKey: REG_CONFIG
      remoteRef:
        key: /apocrypha/regconfig
