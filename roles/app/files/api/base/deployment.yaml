apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
        serviceAccountName: api-server
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      imagePullSecrets:
        - name: api-server-regcred
      containers:
        - name: api-server
          image: api-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          startupProbe:
            httpGet:
              path: /ping
              port: http
          envFrom:
            - configMapRef:
                name: api-server-config
            - secretRef:
                name: api-server-secrets
            - secretRef:
                name: aws-credentials-secret
            - secretRef:
                name: eck-secrets
          env:
            - name: ES_USER
              value: elastic
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eck-secrets
                  key: elastic
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 1000m
              memory: 1000Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/storage-node
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
