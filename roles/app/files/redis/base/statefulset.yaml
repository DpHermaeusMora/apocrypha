apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis-cluster-headless
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: client
            - containerPort: 16379
              name: gossip
          command:
            - sh
            - -c
            - /conf/update-node.sh redis-server /conf/redis.conf
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: "1"
              memory: 1000Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  # Check if Redis is responding
                  redis-cli ping > /dev/null || exit 1
                  
                  # For cluster mode, also check cluster state
                  if redis-cli cluster info > /dev/null 2>&1; then
                    # If cluster is enabled, check cluster state
                    redis-cli cluster info | grep -q "cluster_state:ok" || exit 1
                  fi
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  # Check if Redis is responding
                  redis-cli ping > /dev/null || exit 1
                  
                  # For cluster mode, also check cluster state
                  if redis-cli cluster info > /dev/null 2>&1; then
                    # If cluster is enabled, check cluster state
                    redis-cli cluster info | grep -q "cluster_state:ok" || exit 1
                  fi
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: conf
          configMap:
            name: redis-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "ceph-block"
        resources:
          requests:
            storage: 100Mi
